kind = "mobile"
previewPath = "/mobile/"
title = "Better Bucks Mobile"
version = "1.0.0"
id = "artifacts/better-bucks-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 19186

[services.development]
run = "pnpm --filter @workspace/better-bucks-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/better-bucks-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/better-bucks-mobile", "run", "serve" ]

[services.env]
PORT = "19186"
BASE_PATH = "/mobile/"
